<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云阳县民德小学课后服务报名系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
  .hero { color: #fff; text-align: center; padding: 3rem 1rem; }
  .hero h1 { font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.2); }
  .hero .lead { opacity: .9; }
  .card-box { max-width: 420px; margin: 0 auto; }
</style>
</head>
<body>
<div class="hero">
  <img src="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/icons/star-fill.svg" width="0" height="0" alt="">
  <h1>🎒 课后服务报名系统</h1>
  <p class="lead">云阳县民德小学 · 兴趣社团选课报名</p>
</div>
<div class="container">
  <div class="card card-box shadow-lg border-0">
    <div class="card-body p-4">
      <h5 class="card-title text-center mb-3">选择登录入口</h5>
      <div class="d-grid gap-3">
        <a href="{{ url_for('login') }}" class="btn btn-primary btn-lg">
          <i class="bi bi-person"></i> 班级 / 管理员登录
        </a>
        <div class="text-center small text-muted mt-2">
          班主任使用班级账号登录，为本班学生选报社团
        </div>
      </div>
    </div>
  </div>
  <footer class="text-center text-white-50 mt-4 small">
    云阳县民德小学 · 每个学生限报一个社团
  </footer>
</div>
</body>
</html>
