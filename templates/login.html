<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 云阳县民德小学课后服务报名系统</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
  .login-card { max-width: 400px; margin: 8vh auto; }
</style>
</head>
<body>
<div class="container">
  <div class="card login-card shadow-lg border-0">
    <div class="card-body p-4">
      <h4 class="text-center mb-4">🔐 登录</h4>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="alert alert-{{ cat }} py-2">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="post">
        <div class="mb-3">
          <label class="form-label">账号</label>
          <input type="text" name="username" class="form-control" placeholder="班级账号 / 管理员 / 教师 / 巡课账号" required>
        </div>
        <div class="mb-3">
          <label class="form-label">密码</label>
          <input type="password" name="password" class="form-control" placeholder="密码" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">登录</button>
      </form>
      <div class="text-center small text-muted mt-3">
        支持四类账号：<br>
        <b>管理员</b> / <b>班主任</b>（bj+数字） / <b>教师选课</b> / <b>巡课人员</b>
      </div>
      <div class="text-center small text-muted mt-2">
        <a href="{{ url_for('index') }}">返回首页</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
